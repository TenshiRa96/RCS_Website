<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SiteFlow Checkout</title>
    <link rel="stylesheet" href="/billing/checkout.css">
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  </head>
  <body>
    <main class="billing-shell">
      <section class="billing-card">
        <p class="eyebrow">Reality Computer Software</p>
        <h1 id="billing-title">Preparing secure checkout...</h1>
        <p id="billing-copy" class="copy">Please wait while we open your secure checkout.</p>
        <p id="billing-status" class="status" aria-live="polite"></p>
        <div class="billing-links">
          <a href="/siteflow" target="_blank" rel="noreferrer">Product page</a>
          <a href="/siteflow/pricing" target="_blank" rel="noreferrer">Pricing</a>
          <a href="/siteflow/legal" target="_blank" rel="noreferrer">Terms, privacy, and refunds</a>
          <a href="mailto:realitycomputersoftware@gmail.com">Support</a>
        </div>
        <p class="legal-note">SiteFlow Playbooks is offered by Reality Computer Software SRL.</p>
      </section>
    </main>

    <script src="/billing/checkout-launch.js"></script>
  </body>
</html>
